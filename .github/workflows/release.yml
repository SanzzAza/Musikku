name: Build & Release APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.1.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret $name belum disiapkan. Rilis dibatalkan agar tanda tangan APK tidak berubah."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/VYORA-v${VERSION_NAME}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VYORA-v${{ env.VERSION_NAME }}
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: VYORA v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: dist/*.apk
          body: |
            📱 **VYORA v${{ env.VERSION_NAME }}** — *Royal Violet Liquid Glass Edition (Mode Tamu)*

            ✨ **Fitur Unggulan:**
            - **Tanpa Login Akun (100% Guest Mode)**
            - **Unduhan Offline & Auto-Cache Pintar (hingga 2 GB)**
            - **Saklar Lagu ⇄ Video Klip (MV) di Pemutar**
            - **Lirik Karaoke Per-Kata + Terjemahan Bahasa Indonesia + Romaji (Korea/Jepang)**
            - **Studio Audio VYORA (Slowed + Reverb, Nightcore, Equalizer 5-Band AutoEQ, Bass Boost, 3D Spasial)**
            - **Statistik, Streak Harian & Kartu Story VYORA Recap (PNG)**
            - **Widget Layar Utama Liquid Glass & Studio Poster Cutout AI**

            Download file `.apk` di bawah lalu install di Android 7.0+.
            Commit: ${{ github.sha }}
